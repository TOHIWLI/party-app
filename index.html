
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>PARTY</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  background:radial-gradient(circle at top,#29200d,#080808 55%);
  color:#fff;font-family:Tahoma,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:24px
}
.card{
  width:100%;max-width:390px;text-align:center;
  padding:35px 24px;border:1px solid #80621e;
  border-radius:25px;background:#101010;
  box-shadow:0 15px 55px #000
}
.logo{font-size:42px;font-weight:900;letter-spacing:5px;color:#e6bd57}
.sub{color:#aaa;margin:10px 0 30px}
input{
  width:100%;padding:15px;margin:9px 0;
  border:1px solid #51411f;border-radius:12px;
  background:#191919;color:white;font-size:15px
}
button{
  width:100%;padding:15px;margin-top:16px;
  border:0;border-radius:12px;background:#d6ad49;
  color:#111;font-size:17px;font-weight:bold
}
.note{font-size:12px;color:#888;margin-top:22px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">PARTY</div>
  <p class="sub">بازی کن، دوست پیدا کن، لذت ببر!</p>
  <input type="text" placeholder="نام کاربری یا ایمیل">
  <input type="password" placeholder="رمز عبور">
  <button onclick="alert('به‌زودی ورود واقعی فعال می‌شود!')">
    ورود به PARTY
  </button>
  <p class="note">به دنیای بازی‌های گروهی خوش آمدی</p>
</main>
</body>
</html>
